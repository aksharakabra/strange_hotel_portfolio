<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room not found | Hotel Akshara</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12162B">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,700&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<style>
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: radial-gradient(70% 45% at 50% 0%, rgba(242,184,75,.18), transparent 72%), var(--ink); color: var(--cream); font-family: var(--font-serif); text-align: center; }
  main { max-width: 520px; }
  .num { font: 700 clamp(4rem, 20vw, 8rem)/1 var(--font-serif); color: var(--amber); margin: 0; }
  h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 5vw, 2.2rem); }
  p { margin: 0 0 20px; color: var(--cream-d); font: 400 1.05rem/1.5 var(--font-mono); }
  .hand { font: 500 1.6rem var(--font-hand); color: var(--cream-d); }
  a.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; background: var(--amber); color: var(--ink); border-radius: 999px; font: 500 .95rem var(--font-mono); text-decoration: none; }
  a.btn:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
  a.btn:hover { background: #E5A52F; }
  a.alt { display: block; margin-top: 14px; color: var(--cream-d); font: 400 .85rem var(--font-mono); }
</style>
</head>
<body>
<main>
  <p class="num" aria-hidden="true">404</p>
  <h1>Room not found</h1>
  <p class="hand">Foxie checked the whole building. This floor does not exist (yet).</p>
  <a class="btn" href="index.html">Back to the lobby</a>
  <a class="alt" href="staff.html">Or use the staff entrance</a>
</main>
</body>
</html>
